services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandsentry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AWS_SECRETS_MANAGER_SECRET_NAME=${AWS_SECRETS_MANAGER_SECRET_NAME}
      - AWS_REGION=${AWS_REGION}
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandsentry-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Deployment: - NEXT_PUBLIC_API_URL=http://65.1.209.93:8000
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
